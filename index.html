<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Checklist 5S - DIGITAL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilo para indicar conclusão no menu */
        .nav-links a.completed {
            color: #28a745 !important;
            font-weight: bold;
        }
        .nav-links a.completed::after {
            content: " ✓";
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">DIGITAL</div>
        <nav class="menu-container">
            <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
            <ul id="menu-list" class="nav-links">
                <li><a href="#" id="menu-ferramentas" onclick="showPage('ferramentas')">🔧 Ferramentas</a></li>
                <li><a href="#" id="menu-epis" onclick="showPage('epis')">🦺 EPIs</a></li>
                <li><a href="#" id="menu-viaturas" onclick="showPage('viaturas')">🚗 Viaturas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="header-info">
                <h1>Painel de Viaturas</h1>
                <div id="viaturas-grid" class="viaturas-grid">
                    <!-- Botões das viaturas gerados via JS -->
                </div>
            </div>

            <!-- Página 1: Ferramentas -->
            <section id="ferramentas" class="tab-content active">
                <div class="card">
                    <h2>🔧 Ferramentas e Equipamentos</h2>
                    <div id="lista-ferramentas" class="checklist-items">
                        <p class="placeholder">Aguardando lista de itens...</p>
                    </div>
                    <button class="btn-submit" onclick="finalizarVistoria('ferramentas')" style="margin-top: 20px; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Finalizar Ferramentas</button>
                </div>
            </section>

            <!-- Página 2: EPIs -->
            <section id="epis" class="tab-content">
                <div class="card">
                    <h2>🦺 Equipamentos de Proteção Individual</h2>
                    <div id="lista-epis" class="checklist-items">
                        <p class="placeholder">Aguardando lista de itens...</p>
                    </div>
                    <button class="btn-submit" onclick="finalizarVistoria('epis')" style="margin-top: 20px; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Finalizar EPIs</button>
                </div>
            </section>

            <!-- Página 3: Viaturas -->
            <section id="viaturas" class="tab-content">
                <div class="card">
                    <h2>🚗 Vistoria de Viaturas</h2>
                    <div class="input-group" style="margin-bottom: 20px; max-width: 200px;">
                        <label for="km">KM Atual:</label>
                        <input type="number" id="km" placeholder="Km atual">
                    </div>
                    <div id="lista-viaturas" class="checklist-items">
                        <p class="placeholder">Aguardando lista de itens...</p>
                    </div>
                    <button class="btn-submit" onclick="finalizarVistoria('viaturas')" style="margin-top: 20px; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Finalizar Vistoria Viatura</button>
                </div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
